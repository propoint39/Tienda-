async function shrink(f,M=900,T="image/jpeg"){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,M/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL(T,.7))};i.src=URL.createObjectURL(f)})}
const E=(c,m)=>({"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/email-already-in-use":"Ese correo ya tiene perfil.","auth/weak-password":"La contraseña debe tener mínimo 6 caracteres."}[c]||m||"Error, intenta de nuevo.");

  else if(t.id==="rs"){const x=$("#rt").value.trim();if(!x&&!chImg)return;t.disabled=true;await addDoc(collection(db,"msgs"),{uid:chat,nom:"Pro Point",tel:"",txt:x,img:chImg||"",de:"dueno",leido:true,ts:Date.now()});draft="";chImg=null;R()}
  else if(d.chat){chat=d.chat;draft="";const b=writeBatch(db);M.filter(m=>m.uid===chat&&m.de!=="dueno"&&!m.leido).forEach(m=>b.update(doc(db,"msgs",m.id),{leido:true}));await b.commit();R()}
  else if(d.f){ofil=d.f;R()}
  else if(d.ok){const x=$("#d"+d.ok).value.trim();if(!x){alert("Escribe los datos de la cuenta.");return}await updateDoc(doc(db,"orders",d.ok),{st:"ok",datos:x});const o=O.find(o=>o.id===d.ok);open(wa(o.tel,"¡Tu pedido ha sido un éxito! Tus datos:\n"+x))}
  else if(d.fail){await updateDoc(doc(db,"orders",d.fail),{st:"fail"})}

  else if(t.id==="na"){const n=$("#nn").value.trim(),p=+$("#np").value,c=$("#nc").value.trim()||"Otros";if(n&&p)await addDoc(collection(db,"products"),{n,p,c,off:false,ff:$("#nf").checked,d:$("#nd").value.trim()})}

  else if(d.del){if(confirm("¿Borrar este producto?"))await deleteDoc(doc(db,"products",d.del))}
  else if(d.rph){await updateDoc(doc(db,"products",d.rph),{img:""})}
