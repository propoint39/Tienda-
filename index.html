<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro Point · Pantallas y cuentas digitales</title>
<style>
:root{--bg:#070a12;--card:#0f1422;--bd:#1b2338;--tx:#f2f5fb;--mu:#8a94ad;--ac:#1e90ff;--ok:#22c55e;--wa:#f59e0b;--rd:#ef4444}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--card:#fff;--bd:#dde3ef;--tx:#0d1320;--mu:#5d6882}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:720px;margin:0 auto;padding:16px}h2{font-size:17px;margin:14px 0 8px}
.logo{text-align:center}.logo b{font-size:34px}.logo i{color:var(--ac);font-style:normal}.logo p{margin:2px 0;color:var(--mu);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.tabs button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;white-space:nowrap;cursor:pointer}
.tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}.pr{font-weight:700}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.ok{background:var(--ok)}.btn.x{background:var(--rd)}.btn[disabled]{opacity:.5}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
input[type=checkbox]{width:auto}
.tag{font-size:12px;border-radius:999px;padding:2px 9px}.a{background:#f59e0b33;color:var(--wa)}.c{background:#22c55e33;color:var(--ok)}.o{background:#ef444433;color:var(--rd)}
.off{opacity:.55}img.rc{max-width:100%;border-radius:10px;margin-top:8px}.note{border-left:3px solid var(--ac);padding:8px 12px;border-radius:8px;background:var(--card)}
</style></head><body><div class="w">
<div class="logo"><b>PRO <i>POINT</i></b><p>Pantallas y cuentas digitales · Todo en Pro y Plus</p></div>
<div class="tabs" id="tabs"></div><div id="v"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== CONFIGURA ESTO (ver instrucciones) ====== */
const CFG={apiKey:"AIzaSyCMO7HsHF8y7Ahg102PcXrG-4HRnPx29xo",authDomain:"pro-point-ff3cb.firebaseapp.com",projectId:"pro-point-ff3cb",appId:"1:827303779934:web:e676a371ef6fcf09791ecf"};
const ADMIN="serranoemanuel274@gmail.com"; // tu correo de dueño: el mismo que pones en firestore.rules
/* ================================================= */

if(CFG.apiKey==="PEGA_AQUI"){document.querySelector("#v").innerHTML=`<div class="card"><h2>Falta un paso</h2><p>Esta tienda ya está lista, pero aún no está conectada a tu cuenta de Firebase. Abre el archivo index.html con un editor de texto y pega ahí tus datos de Firebase y tu correo de dueño (donde dice PEGA_AQUI y TU_CORREO).</p></div>`;throw new Error("Falta configurar Firebase")}
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
const SEED=`Netflix pantalla|16000|Streaming
Netflix cuenta completa|48000|Streaming
Prime Video pantalla|8000|Streaming
Prime Video completa|24000|Streaming
Disney+ pantalla Premium sin ESPN|10000|Streaming
Disney+ pantalla Premium + ESPN|12000|Streaming
Disney+ completa Premium + ESPN|48000|Streaming
Max pantalla sin anuncios|7000|Streaming
Max completa sin anuncios|30000|Streaming
Paramount+ pantalla premium|10000|Streaming
Paramount+ completa premium|28000|Streaming
Crunchyroll pantalla Megafan|10000|Streaming
Universal+ pantalla con anuncios|7000|Streaming
Universal+ completa con anuncios|15000|Streaming
Vix premium pantalla|7000|Streaming
Vix premium completa|16000|Streaming
Viki Rakuten pantalla (27 días)|7000|Streaming
Apple TV pantalla|11000|Streaming
Plex pantalla premium|9000|Streaming
Claro video con Win+|30000|Streaming
Tele Latino pantalla|12000|TV en vivo
IPTV pantalla 1 mes|7000|TV en vivo
IPTV completa 1 mes|18000|TV en vivo
Oleada TV completa 1 mes|20000|TV en vivo
Flujo TV pantalla (Android)|10000|TV en vivo
Jellyfin pantalla|8000|TV en vivo
Emby pantalla + canales|12000|TV en vivo
Spotify Premium 1 mes|12000|Música
Spotify Premium 3 meses|25000|Música
Deezer Premium|10000|Música
YouTube Premium 1 mes (Android)|15000|Música
YouTube Premium 3 meses (Android)|28000|Música
ChatGPT Plus 1 mes|30000|Herramientas
CapCut Pro 1 mes (Android)|25000|Herramientas
Adobe Creative Cloud paquete|69000|Herramientas
Office 365 correo genérico|45000|Herramientas
Office 2021 vitalicia|60000|Herramientas
Windows 10 licencia|45000|Herramientas
Windows 11 licencia|55000|Herramientas
Avast antivirus|65000|Antivirus
McAfee antivirus 1 PC|86000|Antivirus
Avira antivirus 5 disp 3M|12000|Antivirus
NordVPN 1 disp|18000|Antivirus
VPN HMA 1 disp|12000|Antivirus
VPN Surfshark 1 disp|21000|Antivirus
Game Pass Ultimate 1 mes|45000|Juegos
PlayStation Plus Essential 1 mes|45000|Juegos
Free Fire 110 diamantes|3800|Juegos
Free Fire 341 diamantes|10800|Juegos
Free Fire 572 diamantes|17500|Juegos
Free Fire 1.166 diamantes|32000|Juegos`;
const cop=n=>"$"+Number(n||0).toLocaleString("es-CO"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s),wan=t=>{t=String(t).replace(/\D/g,"");return t.startsWith("57")?t:"57"+t};
const wa=(t,m)=>"https://wa.me/"+wan(t)+"?text="+encodeURIComponent(m);
let U=null,prof=null,admin=false,tab="tienda",cat="Todos",q="",P=[],O=[],M=[],USR=[],cart={},img=null,msg="",ofil="rev",mode="in";
let cfg={nequi:"3243426972",pago:"Paga por Nequi al 3243426972 y sube la captura del comprobante."};
let unsub=[];

function nav(){
  const nr=O.filter(o=>o.st==="rev").length,nm=M.filter(m=>!m.leido).length,nc=Object.values(cart).reduce((a,b)=>a+b,0);
  let T=[["tienda","Tienda"],["cart","Carrito"+(nc?" ("+nc+")":"")]];
  if(U&&!admin)T.push(["mis","Mis pedidos"],["sop","Soporte"]);
  if(admin)T.push(["ped","Pedidos"+(nr?" ("+nr+")":"")],["prod","Productos"],["bz","Mensajes"+(nm?" ("+nm+")":"")],["usr","Usuarios ("+USR.length+")"],["aj","Ajustes"]);
  T.push(U?["out","Salir"]:["login","Entrar"]);
  $("#tabs").innerHTML=T.map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
  document.title=(admin&&nr?"("+nr+") ":"")+"Pro Point";
}
const R=()=>{nav();({tienda,cart:cartV,mis,sop,ped,prod,bz,usr,aj,login:loginV})[tab]()};
const price=id=>P.find(p=>p.id===id);
const total=()=>Object.entries(cart).reduce((a,[id,n])=>a+(price(id)?.p||0)*n,0);

function tienda(){
  const cats=["Todos",...new Set(P.map(p=>p.c))];
  const L=P.filter(p=>(cat==="Todos"||p.c===cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
  $("#v").innerHTML=`<input id="q" placeholder="Buscar producto" value="${esc(q)}"><div class="tabs">${cats.map(c=>`<button class="chip ${cat===c?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>`+
  (L.map(p=>`<div class="card ${p.off?"off":""}"><div class="row"><div>${esc(p.n)}<br><span class="tag ${p.off?"o":"c"}">${p.off?"Agotado":"Disponible"}</span></div><div style="text-align:right"><div class="pr">${cop(p.p)}</div>${p.off?"":`<button class="btn" data-add="${p.id}">Agregar al carrito</button>`}</div></div></div>`).join("")||`<p class="mu">${P.length?"Sin resultados.":"Cargando catálogo…"}</p>`);
}
function cartV(){
  const ids=Object.keys(cart).filter(i=>price(i));
  if(msg&&tab==="cart"&&!ids.length){$("#v").innerHTML=`<div class="card"><b>✅ ${esc(msg)}</b></div>`;return}
  if(!ids.length){$("#v").innerHTML=`<div class="card mu">Tu carrito está vacío.</div>`;return}
  const ff=ids.some(i=>price(i).ff);
  $("#v").innerHTML=ids.map(i=>{const p=price(i);return`<div class="card row"><div>${esc(p.n)}<br><span class="mu">${cop(p.p)} c/u</span></div><div><button class="btn g" data-m="${i}">−</button> <b>${cart[i]}</b> <button class="btn g" data-add="${i}">+</button></div></div>`}).join("")+
  `<div class="card"><div class="row"><b>Total</b><b style="font-size:20px">${cop(total())}</b></div>
  <div class="note" style="margin:10px 0">${esc(cfg.pago)}<br><b>Nequi: ${esc(cfg.nequi)}</b></div>
  ${U?`${ff?`<label class="mu">ID de Free Fire (obligatorio)</label><input id="ffid" inputmode="numeric" placeholder="Tu ID de jugador">`:""}
  <label class="mu">Foto o captura del pago</label><input id="cf" type="file" accept="image/*">${img?`<img class="rc" src="${img}">`:""}
  <button class="btn" id="send" style="margin-top:10px;width:100%">Enviar pedido</button><p class="mu" id="err"></p>`:`<p class="mu">Para comprar necesitas tu perfil.</p><button class="btn" data-t="login">Crear perfil o entrar</button>`}</div>`;
}
const ST={rev:["a","En revisión"],ok:["c","Tu pedido ha sido un éxito"],fail:["o","Tu pago no ha sido realizado con éxito"]};
function ordCard(o,adm){const t=ST[o.st];
  return`<div class="card"><div class="row"><b>${cop(o.total)}</b><span class="tag ${t[0]}">${adm&&o.st==="ok"?"Éxito":adm&&o.st==="fail"?"Pago fallido":t[1]}</span></div>
  <div class="mu">${adm?esc(o.nom)+" · "+esc(o.tel)+" · "+esc(o.email)+"<br>":""}${new Date(o.ts).toLocaleString("es-CO")}</div>
  <p>${o.items.map(i=>esc(i.n)+" ×"+i.q).join("<br>")}</p>${o.ffid?`<p><b>ID Free Fire:</b> ${esc(o.ffid)}</p>`:""}
  ${adm&&o.img?`<img class="rc" src="${o.img}">`:""}${o.datos?`<div class="note"><b>Tus datos:</b><br>${esc(o.datos).replace(/\n/g,"<br>")}</div>`:""}
  ${adm&&o.st==="rev"?`<textarea id="d${o.id}" rows="3" placeholder="Datos de la cuenta (usuario, clave, perfil…)"></textarea><div class="row"><button class="btn ok" data-ok="${o.id}">Pedido exitoso</button><button class="btn x" data-fail="${o.id}">Pago no realizado</button></div>`:""}
  ${adm&&o.st!=="rev"?`<a class="btn g" href="${wa(o.tel,o.st==="ok"?"¡Tu pedido ha sido un éxito! Tus datos:\n"+(o.datos||""):"Tu pago no ha sido realizado con éxito. Escríbenos para revisarlo.")}">Enviar por WhatsApp</a>`:""}</div>`}
function mis(){$("#v").innerHTML=O.map(o=>ordCard(o,false)).join("")||`<div class="card mu">Aún no tienes pedidos.</div>`}
function sop(){$("#v").innerHTML=`<div class="card"><h2>¿Tienes una falla?</h2><textarea id="mt" rows="4" placeholder="Cuéntanos qué pasó"></textarea><button class="btn" id="ms">Enviar mensaje</button><p class="mu" id="mm"></p>
  ${M.map(m=>`<div class="note" style="margin-top:8px">${esc(m.txt)}<br><span class="mu">${new Date(m.ts).toLocaleString("es-CO")}</span></div>`).join("")}</div>`}
function ped(){
  const F={rev:"En revisión",ok:"Exitosos",fail:"Fallidos",all:"Todos"},L=O.filter(o=>ofil==="all"||o.st===ofil);
  $("#v").innerHTML=`<div class="tabs">${Object.entries(F).map(([k,l])=>`<button class="chip ${ofil===k?"on":""}" data-f="${k}">${l}</button>`).join("")}</div>`+(L.map(o=>ordCard(o,true)).join("")||`<div class="card mu">Sin pedidos.</div>`)}
function prod(){
  $("#v").innerHTML=`<div class="card"><h2>Nuevo producto</h2><input id="nn" placeholder="Nombre"><input id="np" type="number" placeholder="Precio de venta"><input id="nc" placeholder="Categoría (Streaming, Antivirus…)" list="cl"><datalist id="cl">${[...new Set(P.map(p=>p.c))].map(c=>`<option>${esc(c)}`).join("")}</datalist><label class="mu"><input type="checkbox" id="nf"> Pide ID de Free Fire</label><br><button class="btn" id="na">Agregar</button></div>`+
  (P.length?"":`<button class="btn" id="seed">Cargar catálogo inicial (50 productos)</button>`)+
  P.map(p=>`<div class="card ${p.off?"off":""}"><input data-e="n" data-i="${p.id}" value="${esc(p.n)}"><div class="row"><input style="width:42%" type="number" data-e="p" data-i="${p.id}" value="${p.p}"><input style="width:42%" data-e="c" data-i="${p.id}" value="${esc(p.c)}"></div>
  <div class="row"><button class="btn ${p.off?"x":"ok"}" data-off="${p.id}">${p.off?"Agotado":"Disponible"}</button><label class="mu"><input type="checkbox" data-ff="${p.id}" ${p.ff?"checked":""}> ID Free Fire</label><button class="btn g" data-del="${p.id}">Borrar</button></div></div>`).join("")}
function bz(){$("#v").innerHTML=M.map(m=>`<div class="card ${m.leido?"off":""}"><div class="row"><b>${esc(m.nom)}</b><span class="mu">${new Date(m.ts).toLocaleString("es-CO")}</span></div><p>${esc(m.txt)}</p><div class="row"><a class="btn g" href="${wa(m.tel,"Hola "+m.nom+", te escribimos de Pro Point.")}">Responder</a>${m.leido?"":`<button class="btn" data-rd="${m.id}">Marcar leído</button>`}</div></div>`).join("")||`<div class="card mu">Sin mensajes.</div>`}
function usr(){$("#v").innerHTML=USR.map(u=>`<div class="card"><b>${esc(u.nom)}</b><br><span class="mu">${esc(u.email)} · ${esc(u.tel)}<br>Registrado: ${new Date(u.ts).toLocaleDateString("es-CO")}</span><br><a class="btn g" style="margin-top:6px" href="${wa(u.tel,"Hola "+u.nom+", te escribimos de Pro Point.")}">WhatsApp</a></div>`).join("")||`<div class="card mu">Aún no hay usuarios.</div>`}
function aj(){$("#v").innerHTML=`<div class="card"><h2>Ajustes</h2><label class="mu">Número de Nequi</label><input id="an" value="${esc(cfg.nequi)}"><label class="mu">Indicaciones de pago</label><textarea id="ap" rows="3">${esc(cfg.pago)}</textarea><button class="btn" id="as">Guardar</button></div>`}
function loginV(){
  const reg=mode==="reg";
  $("#v").innerHTML=`<div class="card"><h2>${reg?"Crear mi perfil":"Entrar"}</h2>${reg?`<input id="rn" placeholder="Tu nombre"><input id="rt" placeholder="Tu WhatsApp" inputmode="tel">`:""}
  <input id="re" type="email" placeholder="Correo"><input id="rp" type="password" placeholder="Contraseña (mín. 6)"><button class="btn" id="go" style="width:100%">${reg?"Registrarme":"Entrar"}</button><p class="mu" id="er"></p>
  <button class="btn g" data-mode="${reg?"in":"reg"}">${reg?"Ya tengo perfil":"Crear perfil nuevo"}</button> ${reg?"":`<button class="btn g" id="fp">Olvidé mi contraseña</button>`}</div>`}

async function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};i.src=URL.createObjectURL(f)})}
const E=(c,m)=>({"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/email-already-in-use":"Ese correo ya tiene perfil.","auth/weak-password":"La contraseña debe tener mínimo 6 caracteres."}[c]||m||"Error, intenta de nuevo.");

document.addEventListener("click",async e=>{
  const t=e.target.closest("button"),d=t?.dataset||{};if(!t)return;
  if(d.t==="out"){await signOut(auth);tab="tienda";R()}
  else if(d.t){tab=d.t;msg="";R()}
  else if(d.c){cat=d.c;R()}
  else if(d.mode){mode=d.mode;R()}
  else if(d.add){cart[d.add]=(cart[d.add]||0)+1;t.textContent="Agregado ✓";nav();if(tab==="cart")R()}
  else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];R()}
    else if(t.id==="go"){
    const er=$("#er"),em=$("#re").value.trim(),pw=$("#rp").value;er.textContent="";
    try{
      if(mode==="reg"){const n=$("#rn").value.trim(),w=$("#rt").value.trim();if(!n||!w){er.textContent="Pon tu nombre y WhatsApp.";return}
        const c=await createUserWithEmailAndPassword(auth,em,pw);await setDoc(doc(db,"users",c.user.uid),{nom:n,tel:w,email:em,ts:Date.now()})}
      else await signInWithEmailAndPassword(auth,em,pw);tab="tienda"}
    catch(x){er.textContent=E(x.code)}}
  else if(t.id==="fp"){const em=$("#re").value.trim();if(em){await sendPasswordResetEmail(auth,em);$("#er").textContent="Te enviamos un correo para cambiar la contraseña."}}
  else if(t.id==="send"){
    const er=$("#err"),ids=Object.keys(cart).filter(price),ff=$("#ffid")?.value.trim();
    if(!img){er.textContent="Primero sube la foto o captura del pago.";return}
    if(ids.some(i=>price(i).ff)&&!ff){er.textContent="Escribe tu ID de Free Fire.";return}
    t.disabled=true;
    try{await addDoc(collection(db,"orders"),{uid:U.uid,email:U.email,nom:prof?.nom||"",tel:prof?.tel||"",items:ids.map(i=>({n:price(i).n,p:price(i).p,q:cart[i]})),total:total(),ffid:ff||"",img,st:"rev",ts:Date.now()});
      cart={};img=null;msg="Pedido enviado. Está en revisión; te confirmamos pronto en “Mis pedidos”.";R()}
    catch(x){er.textContent="No se pudo enviar: "+(x.code||x.message);t.disabled=false}}
  else if(t.id==="ms"){const x=$("#mt").value.trim();if(!x)return;await addDoc(collection(db,"msgs"),{uid:U.uid,nom:prof?.nom||"",tel:prof?.tel||"",txt:x,leido:false,ts:Date.now()});$("#mt").value="";$("#mm").textContent="✅ Mensaje enviado."}
  else if(d.f){ofil=d.f;R()}
  else if(d.ok){const x=$("#d"+d.ok).value.trim();if(!x){alert("Escribe los datos de la cuenta.");return}await updateDoc(doc(db,"orders",d.ok),{st:"ok",datos:x});const o=O.find(o=>o.id===d.ok);open(wa(o.tel,"¡Tu pedido ha sido un éxito! Tus datos:\n"+x))}
  else if(d.fail){await updateDoc(doc(db,"orders",d.fail),{st:"fail"})}
  else if(t.id==="seed"){const b=writeBatch(db);SEED.split("\n").forEach((l,i)=>{const[n,p,c]=l.split("|");b.set(doc(collection(db,"products")),{n,p:+p,c,off:false,ff:n.startsWith("Free Fire")})});await b.commit()}
  else if(t.id==="na"){const n=$("#nn").value.trim(),p=+$("#np").value,c=$("#nc").value.trim()||"Otros";if(n&&p)await addDoc(collection(db,"products"),{n,p,c,off:false,ff:$("#nf").checked})}
  else if(d.off){const p=price(d.off);await updateDoc(doc(db,"products",d.off),{off:!p.off})}
  else if(d.del){if(confirm("¿Borrar este producto?"))await deleteDoc(doc(db,"products",d.del))}
  else if(d.rd)await updateDoc(doc(db,"msgs",d.rd),{leido:true});
  else if(t.id==="as"){await setDoc(doc(db,"config","main"),{nequi:$("#an").value.trim(),pago:$("#ap").value});t.textContent="Guardado ✓"}
});
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset;
  if(t.id==="cf"&&t.files[0]){img=await shrink(t.files[0]);const f=$("#ffid")?.value;R();if(f)$("#ffid").value=f}
  if(d.e)await updateDoc(doc(db,"products",d.i),{[d.e]:d.e==="p"?+t.value:t.value});
  if(d.ff)await updateDoc(doc(db,"products",d.ff),{ff:t.checked})});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;const p=e.target.selectionStart;tienda();const i=$("#q");i.focus();i.setSelectionRange(p,p)}});

onSnapshot(collection(db,"products"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.c.localeCompare(b.c)||a.n.localeCompare(b.n));if(tab!=="login"&&!document.activeElement.matches("input,textarea"))R()});
onSnapshot(doc(db,"config","main"),s=>{if(s.exists())cfg={...cfg,...s.data()}});
onAuthStateChanged(auth,async u=>{
  unsub.forEach(f=>f());unsub=[];U=u;admin=!!u&&u.email===ADMIN;O=[];M=[];USR=[];prof=null;
  if(u){
    unsub.push(onSnapshot(doc(db,"users",u.uid),s=>{prof=s.data()||null}));
    const oq=admin?collection(db,"orders"):query(collection(db,"orders"),where("uid","==",u.uid));
    let first=true;
    unsub.push(onSnapshot(oq,s=>{if(admin&&!first&&s.docChanges().some(c=>c.type==="added"))try{navigator.vibrate?.(200)}catch(_){}first=false;
      O=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);if(tab!=="login")R()}));
